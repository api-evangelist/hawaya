name: Hawaya
description: Hawaya is a Muslim-focused online dating and matrimonial app that began as Harmonica, an Egyptian
  matchmaking startup backed by 500 Startups (500 Global), and was later acquired by Match Group and rebranded
  as Hawaya. The service emphasized serious, marriage-minded connections with privacy controls tailored to Muslim
  singles across the Middle East, North Africa, and international diaspora markets, offered as consumer iOS and
  Android mobile apps rather than a developer platform. Hawaya was discontinued in 2023 and no longer accepts new
  registrations; it exposes no public API, SDK, or developer program. This API Evangelist profile is retained as
  a company record with identity and legal links captured from the provider's own site.
